name: Sync malicious-package mirror

# Weekly refresh of the offline OSV MAL- denylist used by the anti-slopsquatting
# guard. Opens a PR (never commits straight to main) so a human reviews what the
# external feed adds before it lands.
on:
  schedule:
    - cron: "27 6 * * 1"   # Mondays 06:27 UTC
  workflow_dispatch:

permissions:
  contents: write          # push the update branch
  pull-requests: write     # open the PR

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Refresh the OSV MAL- mirror
        run: python scripts/sync_malicious_packages.py

      - name: Open a PR if the mirror changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/scanners/packages/malicious_mirror.json; then
            echo "Mirror unchanged — nothing to do."
            exit 0
          fi
          branch="chore/malicious-mirror-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add scripts/scanners/packages/malicious_mirror.json
          git commit -m "chore(data): refresh malicious-package mirror"
          git push -u origin "$branch"
          gh pr create --fill --base main --head "$branch" \
            --title "chore(data): refresh malicious-package mirror" \
            --body "Automated weekly OSV MAL- mirror refresh. Review the added package names before merging."
