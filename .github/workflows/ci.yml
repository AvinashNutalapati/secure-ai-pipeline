name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  test:
    name: "🧪 Python tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest --quiet

      - name: Run pytest
        run: python -m pytest tests/ -v

      # actionlint can't validate a composite action's schema, so do a direct
      # structural check — a malformed action.yml breaks every marketplace
      # consumer at `uses:` time.
      - name: Validate action.yml structure
        run: |
          pip install pyyaml --quiet
          python - <<'EOF'
          import yaml
          d = yaml.safe_load(open("action.yml"))
          assert d.get("name"), "action.yml: missing name"
          assert d.get("runs", {}).get("using") == "composite", "action.yml: runs.using must be composite"
          steps = d["runs"].get("steps") or []
          assert steps, "action.yml: no steps"
          for i, s in enumerate(steps):
              assert "uses" in s or "run" in s, f"action.yml: step {i} has neither uses nor run"
              if "run" in s:
                  assert s.get("shell"), f"action.yml: step {i} ({s.get('name')}) needs an explicit shell"
          print(f"action.yml OK: {len(steps)} steps")
          EOF

  actionlint:
    name: "✅ Lint workflows"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # actionlint validates workflow files (.github/workflows/*). It cannot lint
      # action.yml (a composite-action schema), which is why the old
      # `files: action.yml` target failed on every run.
      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2
