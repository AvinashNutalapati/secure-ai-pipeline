name: Secure AI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub code-scanning

jobs:

  # ─────────────────────────────────────────────────────────────
  # STAGE 0 — Secrets (hard block, always)
  # ─────────────────────────────────────────────────────────────
  secrets-scan:
    name: "🔑 Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0          # full history for leak detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "false"   # rendered in our own unified panel
        # Gitleaks exits non-zero on any leak → job fails → pipeline blocks

      - name: Summarise secrets in the run summary
        if: always()
        run: python3 scripts/job_summary.py --section-only --scan secrets "Secrets (Gitleaks)" results.sarif

  # ─────────────────────────────────────────────────────────────
  # STAGE 0 — Anti-slopsquatting (hard block)
  # ─────────────────────────────────────────────────────────────
  package-check:
    name: "📦 Package Existence Check (anti-slopsquatting)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Validate all dependencies exist on registries
        run: python scripts/check_packages.py --json packages.json
        # Exits 1 if any dep name is unresolvable on PyPI or npm

      - name: Summarise dependency trust in the run summary
        if: always()
        run: python3 scripts/job_summary.py --section-only --scan packages "Dependency Trust (anti-slopsquatting)" packages.json

  # ─────────────────────────────────────────────────────────────
  # AI workflow posture — Blast Radius Score (report-only unless a
  # secure-ai-pipeline.yml policy file is present, which makes it gate)
  # ─────────────────────────────────────────────────────────────
  ai-posture:
    name: "🤖 AI Blast Radius"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: AI Agent Blast Radius checkup
        run: python scripts/blast_radius.py "$GITHUB_WORKSPACE" --offline --no-color --json blast.json

      - name: Summarise AI Blast Radius in the run summary
        if: always()
        run: python3 scripts/job_summary.py --section-only --scan ai_posture "AI Workflow Blast Radius" blast.json

  # ─────────────────────────────────────────────────────────────
  # STAGE 1 — SAST (Semgrep — hard block on high-confidence)
  # ─────────────────────────────────────────────────────────────
  sast:
    name: "🔍 SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: [secrets-scan, package-check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Run Semgrep
        run: |
          pip install semgrep --quiet
          semgrep scan \
            --config p/python \
            --config p/javascript \
            --config p/typescript \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config .semgrep/ai-insecure-defaults.yml \
            --sarif --output semgrep.sarif

      - name: Upload SARIF to GitHub
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        # Best-effort: private repos without GitHub Advanced Security can't
        # receive code-scanning SARIF; don't fail the build over the upload.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: semgrep.sarif

      - name: SAST report (report-only — findings shown in the log, never blocks)
        run: python scripts/sarif_gate.py semgrep.sarif --label Semgrep --report-only
        # This repo is a security tool: its own source legitimately uses
        # subprocess and contains security-pattern-shaped code. Specific lines
        # are suppressed with inline `nosemgrep` + reasons; the gate is
        # report-only so a community-rule false-positive can't block the repo.

      - name: Summarise SAST in the run summary
        if: always()
        run: python3 scripts/job_summary.py --section-only --scan sast "SAST (Semgrep)" semgrep.sarif

  # ─────────────────────────────────────────────────────────────
  # STAGE 1 — SCA + IaC + Container (Trivy — block on Critical/High fixable)
  # ─────────────────────────────────────────────────────────────
  sca-iac:
    name: "📋 SCA + IaC (Trivy)"
    runs-on: ubuntu-latest
    needs: [secrets-scan, package-check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trivy — filesystem scan (deps + IaC)
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561 # v0.20.0
        env:
          # Mirror DBs (ghcr.io is rate-limited and fails the DB download).
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"          # block on Critical/High with fix available
          ignore-unfixed: true

      - name: Upload SARIF
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        # Best-effort (see the Semgrep upload note above).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: trivy-fs.sarif

      - name: Summarise SCA in the run summary
        if: always()
        run: python3 scripts/job_summary.py --section-only --scan sca "Dependencies (Trivy SCA)" trivy-fs.sarif

  # ─────────────────────────────────────────────────────────────
  # STAGE 2 — DAST (ZAP baseline — report only, no block)
  # ─────────────────────────────────────────────────────────────
  dast:
    name: "🕷️ DAST (ZAP Baseline)"
    runs-on: ubuntu-latest
    needs: [sast, sca-iac]
    # Only run if a staging URL is configured
    if: ${{ vars.STAGING_URL != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"       # include ajax spider
          fail_action: false      # report only — never block prototype velocity

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: zap-report
          path: report_html.html
