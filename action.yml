name: Secure AI Pipeline
description: Security pipeline for AI-generated code — catches slopsquatting, secrets, CVEs, and insecure defaults.
author: AvinashNutalapati

branding:
  icon: shield
  color: red

inputs:
  staging-url:
    description: URL of your staging environment for DAST scanning. Leave empty to skip DAST.
    required: false
    default: ""
  python-version:
    description: Python version for running scripts.
    required: false
    default: "3.12"
  fail-on-warnings:
    description: Treat WARN-level findings as blocking failures.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: pip install requests --quiet

    - name: Stage 0 — Package existence check (anti-slopsquatting)
      shell: bash
      # Pass the caller's workspace explicitly: the script lives in the action's
      # own checkout (github.action_path), so it must be told which repo to scan.
      run: python ${{ github.action_path }}/scripts/check_packages.py "$GITHUB_WORKSPACE"

    - name: Stage 0 — Secret scan (Gitleaks)
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Stage 1 — SAST (Semgrep)
      shell: bash
      run: |
        pip install semgrep --quiet
        semgrep scan \
          --config p/python \
          --config p/javascript \
          --config p/security-audit \
          --config ${{ github.action_path }}/.semgrep/ai-insecure-defaults.yml \
          --sarif --output semgrep.sarif

    - name: Upload Semgrep SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
      with:
        sarif_file: semgrep.sarif

    - name: Stage 1 — SAST gate (block on errors; warnings only if fail-on-warnings)
      shell: bash
      env:
        FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
      run: python ${{ github.action_path }}/scripts/sarif_gate.py semgrep.sarif --label Semgrep

    - name: Stage 1 — SCA + IaC (Trivy)
      uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561 # v0.20.0
      with:
        scan-type: fs
        format: sarif
        output: trivy.sarif
        severity: ${{ inputs.fail-on-warnings == 'true' && 'CRITICAL,HIGH,MEDIUM,LOW' || 'CRITICAL,HIGH' }}
        exit-code: "1"
        ignore-unfixed: true

    - name: Upload Trivy SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
      with:
        sarif_file: trivy.sarif

    - name: Stage 2 — DAST (ZAP baseline)
      if: ${{ inputs.staging-url != '' }}
      uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
      with:
        target: ${{ inputs.staging-url }}
        rules_file_name: ${{ github.action_path }}/.zap/rules.tsv
        fail_action: false
