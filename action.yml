name: Secure AI Pipeline
description: Security for AI-assisted development — AI Agent Blast Radius plus a consolidated multi-tool scan (secrets, supply-chain/slopsquatting, SCA, SAST, IaC, CI/CD) that runs every installed OSS scanner and reports findings per type with copy-paste AI fix prompts.
author: AvinashNutalapati

branding:
  icon: shield
  color: red

inputs:
  staging-url:
    description: URL of your staging environment for DAST scanning. Leave empty to skip DAST.
    required: false
    default: ""
  python-version:
    description: Python version for running scripts.
    required: false
    default: "3.12"
  fail-on-warnings:
    description: Treat WARN-level findings (HIGH+ from the consolidated scan) as blocking failures.
    required: false
    default: "false"
  upload-sarif:
    description: >-
      Upload the consolidated findings to the GitHub Security tab (code scanning).
      'auto' (default) uploads only on PUBLIC repos, where code scanning is free.
      Private repos need GitHub Advanced Security — set 'true' to force the upload
      there, or 'false' to never upload. When skipped, findings still appear in
      the job summary and still gate the build.
    required: false
    default: "auto"
  deep-scan:
    description: >-
      Also run the heaviest scanners (e.g. GuardDog deep package analysis, which
      downloads and inspects every dependency). Off by default so the standard run
      stays fast; set 'true' for a thorough nightly/release scan.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: ${{ inputs.python-version }}

    # ── Stage 0 — hard gates (these BLOCK the build) ───────────────────────────
    - name: Stage 0 — Package existence check (anti-slopsquatting)
      shell: bash
      # The script lives in the action's own checkout (github.action_path), so it
      # must be told which repo to scan. Quote the path — runner roots can have spaces.
      run: python "${{ github.action_path }}/scripts/check_packages.py" "$GITHUB_WORKSPACE" --json packages.json

    - name: Stage 0 — AI Agent Blast Radius (AI IDEs, Claude, MCP, Actions)
      shell: bash
      # Report-only by default; gates when the caller repo's secure-ai-pipeline.yml
      # policy sets fail_on.
      run: python "${{ github.action_path }}/scripts/blast_radius.py" "$GITHUB_WORKSPACE" --offline --no-color --json blast.json

    - name: Stage 0 — Secret scan (Gitleaks, full git history)
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      env:
        # Composite actions cannot read `secrets` directly. The caller's workflow
        # must export it (and check out with fetch-depth: 0 so the FULL history is
        # scanned) — see the README quickstart:
        #   - uses: actions/checkout@v4
        #     with: { fetch-depth: 0 }
        #   - uses: AvinashNutalapati/secure-ai-pipeline@v3
        #     env:  { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        # We render the secrets result in our own unified summary, so suppress
        # gitleaks-action's separate heading.
        GITLEAKS_ENABLE_SUMMARY: "false"

    # ── Stage 1 — consolidated multi-tool scan (report-first) ──────────────────
    # ONE install + ONE scan, both driven by the scanner registry: every adapter
    # under scripts/scanners/ is installed (if it declares a ci_install) and run.
    # Add a scanner there and it appears here automatically — no edits to this file.
    - name: Stage 1 — Install OSS scanners (best-effort, registry-driven)
      shell: bash
      run: python "${{ github.action_path }}/scripts/install_scanners.py" ${{ inputs.deep-scan == 'true' && '--deep' || '' }} || true

    - name: Stage 1 — Unified scan (every installed scanner, consolidated per type)
      shell: bash
      env:
        # Pull Trivy's vuln DBs from the AWS ECR mirror — the default ghcr.io
        # source is heavily rate-limited and intermittently fails the download.
        TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
      # Tools run in PARALLEL with progress on stderr + bounded per-tool timeouts
      # (SAP_TOOL_TIMEOUT, default 300s; SAP_SCAN_CONCURRENCY, default 4) so the
      # step never looks frozen and one slow scanner can't stall the job. --offline
      # skips the network slopsquatting the Stage 0 gate already did.
      # Report-first by default (|| true so a scanner hiccup never breaks the
      # build); fail-on-warnings makes HIGH+ findings block. scan.json feeds the
      # summary, sap.sarif feeds code scanning — both written before any gate.
      run: |
        DEEP_ARGS=()
        [ "${{ inputs.deep-scan }}" = "true" ] && DEEP_ARGS=(--deep)
        if [ "${{ inputs.fail-on-warnings }}" = "true" ]; then
          python "${{ github.action_path }}/scripts/scan_all.py" "$GITHUB_WORKSPACE" \
            --only secrets,packages,sca,sast,iac,ci_cd \
            --offline "${DEEP_ARGS[@]}" --no-input --no-color --no-fix-prompts --no-dast \
            --json scan.json --sarif sap.sarif --fail-on high
        else
          python "${{ github.action_path }}/scripts/scan_all.py" "$GITHUB_WORKSPACE" \
            --only secrets,packages,sca,sast,iac,ci_cd \
            --offline "${DEEP_ARGS[@]}" --no-input --no-color --no-fix-prompts --no-dast \
            --json scan.json --sarif sap.sarif || true
        fi

    - name: Stage 1 — Upload findings to code scanning
      # Upload to the Security tab ONLY where code scanning works: public repos
      # (free), or when forced on (private + GitHub Advanced Security). On a
      # private/no-GHAS repo the upload 403s; a failing `uses:` step inside a
      # composite action fails the whole run even with continue-on-error — so we
      # skip rather than try. Findings stay in the job summary and the gate.
      if: ${{ always() && hashFiles('sap.sarif') != '' && (inputs.upload-sarif == 'true' || (inputs.upload-sarif == 'auto' && github.event.repository.private == false)) }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
      with:
        sarif_file: sap.sarif

    # ── Unified job summary (report-only; never fails the build) ───────────────
    - name: Job summary — findings + copy-paste fix prompts
      if: always()
      shell: bash
      # One uniform section per scan type — Secrets, Dependency Trust (anti-
      # slopsquatting), Dependencies (SCA), SAST, IaC, CI/CD, AI Workflow Blast
      # Radius — each consolidating every tool that ran, with a suggested fix and
      # a copy-paste AI fix prompt, plus one combined prompt.
      run: |
        python "${{ github.action_path }}/scripts/job_summary.py" \
          --scan secrets "Secrets (Gitleaks — full history)" results.sarif \
          --scan packages "Dependency Trust (anti-slopsquatting)" packages.json \
          --scan ai_posture "AI Workflow Blast Radius" blast.json \
          --scan-all scan.json

    # ── Stage 2 — DAST (report only) ───────────────────────────────────────────
    - name: Stage 2 — Stage ZAP rules into the workspace
      if: ${{ inputs.staging-url != '' }}
      shell: bash
      # The ZAP container mounts only the workspace — a file under
      # github.action_path is invisible inside it. Copy the bundled rules in,
      # honouring a repo-provided .zap/rules.tsv if one already exists.
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/.zap/rules.tsv" ]; then
          mkdir -p "$GITHUB_WORKSPACE/.zap"
          cp "${{ github.action_path }}/.zap/rules.tsv" "$GITHUB_WORKSPACE/.zap/rules.tsv"
        fi

    - name: Stage 2 — DAST (ZAP baseline)
      if: ${{ inputs.staging-url != '' }}
      uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
      with:
        target: ${{ inputs.staging-url }}
        rules_file_name: ".zap/rules.tsv"
        fail_action: false
