name: Secure AI Pipeline
description: AI-assisted development security — AI Agent Blast Radius (AI IDEs, Claude, MCP, GitHub Actions) plus package, secret, SAST, and SCA checks.
author: AvinashNutalapati

branding:
  icon: shield
  color: red

inputs:
  staging-url:
    description: URL of your staging environment for DAST scanning. Leave empty to skip DAST.
    required: false
    default: ""
  python-version:
    description: Python version for running scripts.
    required: false
    default: "3.12"
  fail-on-warnings:
    description: Treat WARN-level findings as blocking failures.
    required: false
    default: "false"
  upload-sarif:
    description: >-
      Upload SAST/SCA findings to the GitHub Security tab (code scanning).
      'auto' (default) uploads only on PUBLIC repos, where code scanning is
      free. Private repos need GitHub Advanced Security — set 'true' to force
      the upload there, or 'false' to never upload. When skipped, findings still
      appear in the job log and still gate the build.
    required: false
    default: "auto"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Stage 0 — Package existence check (anti-slopsquatting)
      shell: bash
      # Pass the caller's workspace explicitly: the script lives in the action's
      # own checkout (github.action_path), so it must be told which repo to scan.
      # The action path is quoted — runner roots can contain spaces.
      run: python "${{ github.action_path }}/scripts/check_packages.py" "$GITHUB_WORKSPACE"

    - name: Stage 0 — AI Agent Blast Radius (AI IDEs, Claude, MCP, Actions)
      shell: bash
      # Report-only by default; gates when the caller repo has a
      # secure-ai-pipeline.yml policy with fail_on set.
      run: python "${{ github.action_path }}/scripts/blast_radius.py" "$GITHUB_WORKSPACE" --offline --no-color

    - name: Stage 0 — Secret scan (Gitleaks)
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      env:
        # Composite actions cannot read `secrets` directly. The caller's
        # workflow must export it (and check out with fetch-depth: 0 so the
        # FULL history is scanned, not just HEAD) — see the README quickstart:
        #   - uses: actions/checkout@v4
        #     with: { fetch-depth: 0 }
        #   - uses: AvinashNutalapati/secure-ai-pipeline@v2
        #     env:  { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Stage 1 — SAST (Semgrep)
      shell: bash
      run: |
        pip install semgrep --quiet
        semgrep scan \
          --config p/python \
          --config p/javascript \
          --config p/security-audit \
          --config "${{ github.action_path }}/.semgrep/ai-insecure-defaults.yml" \
          --sarif --output semgrep.sarif

    - name: Upload Semgrep SARIF
      # Upload to the Security tab ONLY where code scanning works: public repos
      # (free), or when forced on (private + GitHub Advanced Security). On a
      # private/no-GHAS repo the upload 403s, and a failing `uses:` step inside a
      # composite action fails the whole run even with continue-on-error — so we
      # skip rather than try. Findings stay in the job log and the SAST gate.
      if: ${{ always() && hashFiles('semgrep.sarif') != '' && (inputs.upload-sarif == 'true' || (inputs.upload-sarif == 'auto' && github.event.repository.private == false)) }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
      with:
        sarif_file: semgrep.sarif

    - name: Stage 1 — SAST gate (block on errors; warnings only if fail-on-warnings)
      shell: bash
      env:
        FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
      run: python "${{ github.action_path }}/scripts/sarif_gate.py" semgrep.sarif --label Semgrep

    - name: Stage 1 — SCA + IaC (Trivy)
      uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561 # v0.20.0
      env:
        # Pull the vuln DBs from the AWS ECR mirror. The default ghcr.io source
        # is heavily rate-limited and intermittently fails the DB download,
        # which produces no SARIF and then breaks the upload step.
        TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
      with:
        scan-type: fs
        format: sarif
        output: trivy.sarif
        severity: ${{ inputs.fail-on-warnings == 'true' && 'CRITICAL,HIGH,MEDIUM,LOW' || 'CRITICAL,HIGH' }}
        # Report-only by default (exit 0): CVE findings are shown but don't fail
        # the build. Set fail-on-warnings: true to BLOCK on Critical/High CVEs.
        exit-code: ${{ inputs.fail-on-warnings == 'true' && '1' || '0' }}
        ignore-unfixed: true

    - name: Upload Trivy SARIF
      # Same gate as the Semgrep upload: only where code scanning works (skip on
      # private/no-GHAS). Also requires the SARIF to exist (DB hiccup → no file).
      if: ${{ always() && hashFiles('trivy.sarif') != '' && (inputs.upload-sarif == 'true' || (inputs.upload-sarif == 'auto' && github.event.repository.private == false)) }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
      with:
        sarif_file: trivy.sarif

    - name: Stage 1 — Findings summary (SAST + SCA)
      if: always()
      shell: bash
      # Report-only: surfaces Semgrep + Trivy findings in the log and the run's
      # Step Summary, so they're visible even when SARIF wasn't uploaded to the
      # Security tab. Never fails the build.
      run: |
        python "${{ github.action_path }}/scripts/sarif_summary.py" semgrep.sarif --label "SAST (Semgrep)"
        python "${{ github.action_path }}/scripts/sarif_summary.py" trivy.sarif --label "SCA (Trivy)"

    - name: Stage 2 — Stage ZAP rules into the workspace
      if: ${{ inputs.staging-url != '' }}
      shell: bash
      # The ZAP container mounts only the workspace — a file under
      # github.action_path is invisible inside it. Copy the bundled rules in,
      # honouring a repo-provided .zap/rules.tsv if one already exists.
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/.zap/rules.tsv" ]; then
          mkdir -p "$GITHUB_WORKSPACE/.zap"
          cp "${{ github.action_path }}/.zap/rules.tsv" "$GITHUB_WORKSPACE/.zap/rules.tsv"
        fi

    - name: Stage 2 — DAST (ZAP baseline)
      if: ${{ inputs.staging-url != '' }}
      uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
      with:
        target: ${{ inputs.staging-url }}
        rules_file_name: ".zap/rules.tsv"
        fail_action: false
