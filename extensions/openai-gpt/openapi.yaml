openapi: 3.1.0
info:
  title: Secure AI Pipeline
  description: >-
    Security scanner for AI-generated code. Verifies package names against public
    registries (anti-slopsquatting), scans snippets for insecure defaults, and
    reports known CVEs in pinned dependencies. All operations are read-only.
  version: 3.1.0
servers:
  # GPT Actions require a public HTTPS host. This is the Render deployment of
  # extensions/claude_mcp/server.py behind the custom domain (see
  # docs/domain-setup.md for the DNS records).
  - url: https://api.mirawyn.com
    description: Secure AI Pipeline scanner API (mirawyn.com).
security:
  - ApiKeyAuth: []
paths:
  /check_package:
    post:
      operationId: checkPackage
      summary: Verify a package exists on PyPI or npm (anti-slopsquatting).
      x-openai-isConsequential: false  # nosemgrep: yaml.openapi.security.openai-consequential-action-false.openai-consequential-action-false -- read-only scanner endpoints; intentionally non-consequential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPackageRequest"
      responses:
        "200":
          description: Existence result for the package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPackageResponse"
  /sast_scan:
    post:
      operationId: sastScan
      summary: Scan a code snippet for insecure patterns.
      x-openai-isConsequential: false  # nosemgrep: yaml.openapi.security.openai-consequential-action-false.openai-consequential-action-false -- read-only scanner endpoints; intentionally non-consequential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SastRequest"
      responses:
        "200":
          description: SAST findings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SastResponse"
  /sca_scan:
    post:
      operationId: scaScan
      summary: Check pinned dependency versions for known CVEs.
      x-openai-isConsequential: false  # nosemgrep: yaml.openapi.security.openai-consequential-action-false.openai-consequential-action-false -- read-only scanner endpoints; intentionally non-consequential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaRequest"
      responses:
        "200":
          description: Known CVEs for the supplied dependencies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScaResponse"
  /full_scan:
    post:
      operationId: fullScan
      summary: Run package, SAST and SCA checks together and report a blocking decision.
      x-openai-isConsequential: false  # nosemgrep: yaml.openapi.security.openai-consequential-action-false.openai-consequential-action-false -- read-only scanner endpoints; intentionally non-consequential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FullRequest"
      responses:
        "200":
          description: Combined scan result with a blocking decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullScanResponse"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    CheckPackageRequest:
      type: object
      required:
        - package
      properties:
        package:
          type: string
          description: Package name to verify.
        registry:
          type: string
          enum:
            - pypi
            - npm
          default: pypi
          description: Registry to check the package against.
    CheckPackageResponse:
      type: object
      required:
        - exists
      properties:
        exists:
          type: [boolean, "null"]
          description: >-
            Tri-state: true = exists; false = confirmed missing on the registry
            (slopsquatting risk — do not install); null = registry unreachable,
            could NOT be verified (not a missing verdict).
        latest_version:
          type: [string, "null"]
          description: Latest published version, when the package exists.
        warning:
          type: [string, "null"]
          description: Slopsquatting or network warning when exists is false/null.
    SastRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Source code to scan.
        language:
          type: string
          enum:
            - python
            - javascript
          default: python
          description: Language of the snippet.
    SastResponse:
      type: object
      required:
        - findings
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/SastFinding"
    ScaRequest:
      type: object
      required:
        - requirements
      properties:
        requirements:
          type: string
          description: Raw requirements.txt content (one pinned dependency per line).
    ScaResponse:
      type: object
      required:
        - vulnerabilities
      properties:
        vulnerabilities:
          type: array
          items:
            $ref: "#/components/schemas/ScaFinding"
    FullRequest:
      type: object
      properties:
        code:
          type: string
          default: ""
          description: Source code to scan.
        requirements:
          type: string
          default: ""
          description: Raw requirements.txt content.
        language:
          type: string
          enum:
            - python
            - javascript
          default: python
    FullScanResponse:
      type: object
      required:
        - findings
        - blocked
        - summary
      properties:
        findings:
          $ref: "#/components/schemas/FullFindings"
        blocked:
          type: boolean
          description: True if any finding is at a blocking severity or a package is non-existent.
        summary:
          type: string
          description: A human-readable sentence describing the result.
    FullFindings:
      type: object
      properties:
        sast:
          type: array
          items:
            $ref: "#/components/schemas/SastFinding"
        sca:
          type: array
          items:
            $ref: "#/components/schemas/ScaFinding"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PackageWarning"
    SastFinding:
      type: object
      properties:
        rule:
          type: string
        line:
          type: integer
        severity:
          type: string
        message:
          type: string
        fix:
          type: string
    ScaFinding:
      type: object
      properties:
        package:
          type: string
        version:
          type: string
        cve:
          type: string
        severity:
          type: string
        fix_version:
          type: string
    PackageWarning:
      type: object
      properties:
        package:
          type: string
        warning:
          type: string
